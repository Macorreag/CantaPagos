<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 500px; overflow: hidden; background: #070B14; }
  body {
    background: #070B14;
    color: #F8FAFC;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .glow {
    position: absolute; width: 780px; height: 780px;
    top: -430px; right: -160px;
    background: radial-gradient(circle, rgba(16,185,129,.32) 0%, rgba(4,120,87,.10) 45%, transparent 68%);
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(to right, rgba(148,163,184,.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(148,163,184,.07) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: radial-gradient(ellipse 70% 70% at 40% 40%, #000 10%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse 70% 70% at 40% 40%, #000 10%, transparent 78%);
  }
  .inner {
    position: relative;
    width: 100%; height: 100%;
    padding: 58px 64px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 13px; margin-bottom: 22px; }
  .mark {
    width: 46px; height: 46px; display: grid; place-items: center;
    border-radius: 13px;
    color: #10B981; background: rgba(16,185,129,.13);
    border: 1px solid rgba(16,185,129,.35);
  }
  .mark svg { width: 24px; height: 24px; }
  .name { font-size: 27px; font-weight: 800; letter-spacing: -.035em; }
  h1 { font-size: 58px; line-height: 1.02; letter-spacing: -.045em; font-weight: 800; margin-bottom: 14px; }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, #FFFFFF 5%, #34D399 55%, #06B6D4 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 21px; color: #94A3B8; }
  .badges { position: absolute; right: 64px; bottom: 54px; display: flex; gap: 9px; }
  .badges span {
    font-size: 15px; font-weight: 700; color: #D1FAE5;
    padding: 7px 13px; border-radius: 999px;
    background: rgba(16,185,129,.09);
    border: 1px solid rgba(16,185,129,.34);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="inner">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>
      </span>
      <span class="name">CantaPagos</span>
    </div>

    <h1>Tu celular <em>canta</em> los pagos.</h1>
    <p class="sub">Nequi, Daviplata y Bancolombia anunciados en voz alta. Sin internet.</p>
  </div>

  <div class="badges">
    <span>Gratis</span>
    <span>Sin anuncios</span>
    <span>Sin permiso de internet</span>
  </div>
</body>
</html>
